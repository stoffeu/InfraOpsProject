<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastrar Equipamento | Administração de TI</title>
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
    <aside class="sidebar">

        <div class="logo-area">
            <img src="../img/logo-infraops-semfundo.png" alt="Logo">
            <h2>HelpDesk TI</h2>
        </div>

        <nav>

            <a href="telaInicial.html" class="active">
                <i class="fa-solid fa-house"></i>
                Início
            </a>

            <a href="chamados.html">
                <i class="fa-solid fa-ticket"></i>
                Chamados
            </a>

            <a href="equipamentos.html">
                <i class="fa-solid fa-computer"></i>
                Equipamentos
            </a>

            <a href="tecnico.html">
                <i class="fa-solid fa-users"></i>
                Técnicos
            </a>

            <a href="relatorios.html">
                <i class="fa-solid fa-chart-line"></i>
                Relatórios
            </a>

            <a href="configuracoes.html">
                <i class="fa-solid fa-gear"></i>
                Configurações
            </a>

        </nav>

    </aside>

    <main class="main-content">
        <header>
            <div>
                <h1>Cadastrar Equipamento</h1>
                <p>Adicione um novo ativo ao inventário.</p>
            </div>
            <a href="equipamentos.html"><button><i class="fa-solid fa-arrow-left"></i> Voltar</button></a>
        </header>

        <section class="table-area">
            <div class="table-header">
                <h2>Formulário de cadastro</h2>
            </div>

            <form id="formEquipamento" style="display:flex; flex-direction:column; gap:12px;">
                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <label style="flex:1; min-width:180px;">
                        Tipo *
                        <select id="tipo" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
                            <option value="">Selecione</option>
                            <option value="Computador">Computador</option>
                            <option value="Notebook">Notebook</option>
                            <option value="Impressora">Impressora</option>
                            <option value="Projetor">Projetor</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </label>

                    <label style="flex:1; min-width:180px;">
                        Marca / Modelo *
                        <input id="marca" type="text" required placeholder="Ex: Dell OptiPlex 7080" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;" />
                    </label>

                    <label style="flex:1; min-width:180px;">
                        Identificador *
                        <input id="identificador" type="text" required placeholder="Ex: EQ-001 / MB-1245" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;" />
                    </label>

                    <label style="flex:1; min-width:180px;">
                        Local *
                        <input id="local" type="text" required placeholder="Ex: RH - Sala 2" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;" />
                    </label>
                </div>

                <label>
                    Especificações
                    <textarea id="especificacoes" rows="4" placeholder="CPU, RAM, Disco, portas, observações" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;"></textarea>
                </label>

                <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
                    <label style="min-width:180px;">
                        Status *
                        <select id="status" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
                            <option value="Disponível">Disponível</option>
                            <option value="Em uso">Em uso</option>
                            <option value="Manutenção">Manutenção</option>
                        </select>
                    </label>

                    <button type="submit" style="background:#00a859; color:white; border:none; padding:12px 18px; margin-top: 16px; border-radius:10px; cursor:pointer;">Salvar</button>
                </div>
            </form>
        </section>
    </main>

    <script>
        const form = document.getElementById('formEquipamento');

        function lerEquipamentos() {
            try {
                return JSON.parse(localStorage.getItem('equipamentos') || '[]');
            } catch (e) {
                return [];
            }
        }

        function salvarEquipamentos(lista) {
            localStorage.setItem('equipamentos', JSON.stringify(lista));
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const novo = {
                id: document.getElementById('identificador').value.trim(),
                tipo: document.getElementById('tipo').value,
                marca: document.getElementById('marca').value.trim(),
                identificador: document.getElementById('identificador').value.trim(),
                local: document.getElementById('local').value.trim(),
                especificacoes: document.getElementById('especificacoes').value.trim(),
                status: document.getElementById('status').value,
                criadoEm: new Date().toISOString()
            };

            if (!novo.tipo || !novo.marca || !novo.identificador || !novo.local) {
                alert('Preencha todos os campos obrigatórios.');
                return;
            }

            const equipamentos = lerEquipamentos();
            equipamentos.push(novo);
            salvarEquipamentos(equipamentos);

            alert('Equipamento cadastrado com sucesso!');
            window.location.href = 'equipamentos.html';
        });
    </script>
</body>
</html>
