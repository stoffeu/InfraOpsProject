<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>

        <link rel="stylesheet" href="../css/login.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        
    </head>
    <body>
        <div class="container">
            <!-- Lado esquerdo -->
            <div class="left">

                <!-- Logo -->
                <img src="../img/logo-infraops-semfundo.png" alt="Logo" class="logo">

                <h1>Bem-vindo</h1>

                <form>

                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" placeholder="Usuário">
                    </div>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" placeholder="Senha">
                    </div>

                    <div class="options">
                        <label>
                            <input type="checkbox">
                            Lembrar-me
                        </label>

                        <a href="#">Esqueceu a senha?</a>
                    </div>

                    <button type="submit"><a href="telaInicial.html">Entrar</a></button>

                </form>
            </div>

            <!-- Lado direito -->
            <div class="right">
                <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" alt="Ilustração">
            </div>
        </div>
    </body>
</html>
